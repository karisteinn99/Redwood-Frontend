name: Deploy Worker

# Deploys party/index.ts (a Cloudflare Worker + Durable Object, via
# Wrangler) to your own Cloudflare account on every push to main. This is
# separate from Vercel's build — Vercel only deploys the Next.js frontend,
# so this is what keeps the realtime server in sync with it. See AGENTS.md
# for why this isn't PartyKit anymore.
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
